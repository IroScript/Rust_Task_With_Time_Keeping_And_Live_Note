[package]
name = "backend"
version = "0.1.0"
edition = "2021"
description = "Pure Rust Backend with Live Editing and Offline Support"

[dependencies]
# Async runtime
tokio = { version = "1.42", features = ["full"] }

# Web framework
axum = { version = "0.8", features = ["ws", "macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "compression-gzip"] }

# WebSocket
tokio-tungstenite = "0.24"
futures-util = "0.3"

# Database - SQLite (embedded) + PostgreSQL (cloud) support
sqlx = { version = "0.7", features = ["runtime-tokio", "sqlite", "postgres", "uuid", "chrono", "migrate"] }

# CRDT for conflict-free sync
yrs = "0.21"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# UUID generation
uuid = { version = "1.11", features = ["v4", "serde"] }

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Environment variables
dotenvy = "0.15"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Concurrent data structures
dashmap = "6.1"

# TLS (memory-safe)
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

# Workspace shared types
shared = { path = "../crates/shared" }

# Property-based testing
proptest = "1.4"

[profile.release]
opt-level = 3
lto = true
strip = true
