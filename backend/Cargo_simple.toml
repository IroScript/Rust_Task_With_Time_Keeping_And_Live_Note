[package]
name = "backend"
version = "0.1.0"
edition = "2021"

# Minimal dependencies to test compilation
[dependencies]
# These are built-in or have minimal dependencies
serde = { version = "1.0", features = ["derive"], default-features = false }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }

[profile.release]
opt-level = 3
